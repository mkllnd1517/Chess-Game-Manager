name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar bibliotecas del sistema para Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - name: Instalar proyecto y pruebas
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Comprobar sintaxis
        run: python -m compileall chessstudio
      - name: Ejecutar pruebas de interfaz sin pantalla
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python -m pytest --junitxml=pytest.xml 2>&1 | tee pytest-output.txt
      - name: Publicar diagnóstico si fallan las pruebas
        if: failure()
        run: |
          echo "## Diagnóstico de pytest" >> "$GITHUB_STEP_SUMMARY"
          for report in pytest-output.txt pytest.xml; do
            if [ -f "$report" ]; then
              echo "### $report" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              sed -n '1,500p' "$report" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          # Deja las últimas líneas también como anotación visible desde la
          # lista de comprobaciones, incluso si Qt termina el proceso de golpe.
          message=$(tail -n 80 pytest-output.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Salida de pytest::$message"

  package:
    name: Validar paquete de escritorio
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar bibliotecas del sistema para Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - name: Instalar herramientas de empaquetado
        run: python -m pip install --upgrade pip && python -m pip install -e ".[build]"
      - name: Crear paquete PyInstaller
        run: python scripts/build_release.py
      - name: Verificar contenido legal y recursos
        run: |
          # PyInstaller 6 coloca datos y librerías en _internal/ en las
          # compilaciones one-folder; el bootloader lo expone como _MEIPASS.
          test -f dist/ChessGamesManager/_internal/LICENSE
          test -f dist/ChessGamesManager/_internal/NOTICE
          test -f dist/ChessGamesManager/_internal/THIRD_PARTY_NOTICES.md
          test -f dist/ChessGamesManager/THIRD_PARTY_COMPONENTS.json
          test -f dist/ChessGamesManager/_internal/chessstudio/pieces/wK.svg
          test -f dist/ChessGamesManager/_internal/chessstudio/assets/chessstudio.svg
