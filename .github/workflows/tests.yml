name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar bibliotecas del sistema para Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - name: Instalar proyecto y pruebas
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Comprobar sintaxis
        run: python -m compileall chessstudio
      - name: Ejecutar pruebas de interfaz sin pantalla
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  package:
    name: Validar paquete de escritorio
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar bibliotecas del sistema para Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - name: Instalar herramientas de empaquetado
        run: python -m pip install --upgrade pip && python -m pip install -e ".[build]"
      - name: Crear paquete PyInstaller
        run: python scripts/build_release.py
      - name: Verificar contenido legal y recursos
        run: |
          test -f dist/ChessStudio/LICENSE
          test -f dist/ChessStudio/NOTICE
          test -f dist/ChessStudio/THIRD_PARTY_NOTICES.md
          test -f dist/ChessStudio/chessstudio/pieces/wK.svg
          test -f dist/ChessStudio/chessstudio/assets/chessstudio.svg
